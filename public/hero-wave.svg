<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.8" />
      <stop offset="25%" style="stop-color:#A855F7;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#9333EA;stop-opacity:0.6" />
      <stop offset="75%" style="stop-color:#7C3AED;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="purpleGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C084FC;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <!-- Background layer -->
  <path d="M0,300 C300,200 500,400 800,300 C1000,200 1100,350 1200,250 L1200,600 L0,600 Z" fill="url(#purpleGradient)" />
  
  <!-- Middle layer -->
  <path d="M0,350 C200,250 400,450 600,350 C800,250 1000,400 1200,300 L1200,600 L0,600 Z" fill="url(#purpleGradient2)" />
  
  <!-- Front layer -->
  <path d="M0,400 C300,300 500,500 800,400 C1000,300 1100,450 1200,350 L1200,600 L0,600 Z" fill="url(#purpleGradient)" opacity="0.6" />
  
  <!-- Animated wave effect -->
  <path d="M0,320 C300,220 500,420 800,320 C1000,220 1100,370 1200,270 L1200,600 L0,600 Z" fill="url(#purpleGradient2)" opacity="0.3">
    <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 0; 100 10; 0 0" dur="8s" repeatCount="indefinite"/>
  </path>
</svg>